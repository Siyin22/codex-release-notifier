name: Codex stable release email
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send one test email without checking releases'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: codex-release-email
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check releases and send email
        run: |
          if [ "$TEST_EMAIL" = "true" ]; then
            python notify.py --test-email
          else
            python notify.py
          fi
        env:
          TEST_EMAIL: ${{ inputs.test_email }}
          GH_TOKEN: ${{ github.token }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.163.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Persist notification history
        if: ${{ !inputs.test_email }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/releases.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update notified Codex release history'
            git push origin HEAD:main
          fi
